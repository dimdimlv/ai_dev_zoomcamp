{% extends 'base.html' %}

{% block title %}{% if form.instance.pk %}Edit Todo{% else %}New Todo{% endif %}{% endblock %}

{% block content %}
<h1>{% if form.instance.pk %}Edit Todo{% else %}New Todo{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'todo_list' %}" class="btn">Cancel</a>
</form>
{% endblock %}
